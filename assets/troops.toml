# Elixir troops in the order the army editor shows them (column by column,
# top row then bottom row). `housing` is camp space per troop.
#
# Roles decide deploy order: tanks go first to soak damage, wall breakers
# open the way, damage dealers follow, support comes last.
# Values reflect the game when this file was written; edit if they change.

